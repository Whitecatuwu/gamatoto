<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加碼多多日誌生成器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>加碼多多日誌生成器</h1>

    <input type="text" id="userInput" placeholder="輸入文字">
    <button onclick="generateContent()">生成內容</button>

    <div id="output"></div>

    <script>
        let a = [];
        let b = [];

        // 讀取 CSV 文件並解析內容
        async function loadCSV(filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`無法加載文件: ${filePath}`);
                }
                const text = await response.text();
                return text.trim().split("\n").map(line => line.split("|")[0].trim());
            } catch (error) {
                console.error(error);
                alert(`讀取 ${filePath} 失敗，請檢查路徑或檔案是否存在。`);
                return [];
            }
        }

        // 初始化 a 和 b 內容
        async function init() {
            a = await loadCSV("GamatotoExpedition_Log_2_tw.csv");
            b = await loadCSV("GamatotoExpedition_Log_3_tw.csv");
        }

        function generateContent() {
            if (a.length === 0 || b.length === 0) {
                init();
            }
            const input = document.getElementById('userInput').value;
            if (!input) {
                alert('請輸入文字');
                return;
            }

            const randomA = a[Math.floor(Math.random() * a.length)];
            const randomB = b[Math.floor(Math.random() * b.length)];

            const output = `${input}${randomA}${randomB}`;
            document.getElementById('output').textContent = output;
        }
        
        //init();
    </script>

</body>
</html>
